[project]
name = "coq-harness"
version = "0.2.0"
description = "Harness that lets Mistral Large 4 play Caves of Qud — screenshot-based and MCP modes"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "pydantic>=2.0",
    "mistralai>=1.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
coq-harness = "main:main"
coq-mcp = "main_mcp:main"
coq-replay = "recording.replay:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["main", "main_mcp"]
packages = [
    "client",
    "game",
    "tools",
    "perception",
    "memory",
    "agent",
    "loop",
    "run",
    "recording",
    "mcp",
]
