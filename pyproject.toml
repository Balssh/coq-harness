[project]
name = "coq-harness"
version = "0.2.0"
description = "Harness that lets an LLM (Mistral Large 4 by default) play Caves of Qud through an in-game MCP bridge"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
coq-play = "harness.__main__:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["harness"]

[tool.setuptools.package-data]
harness = ["prompts/*.md", "viewer/*.html"]
