<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoQ Harness — Replay Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e; color: #e0e0e0; display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }
  #header {
    padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460;
    display: flex; align-items: center; gap: 16px; flex-shrink: 0;
  }
  #header h1 { font-size: 14px; font-weight: 600; color: #e94560; }
  #controls { display: flex; align-items: center; gap: 8px; }
  #controls button {
    background: #0f3460; color: #e0e0e0; border: 1px solid #e94560;
    border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 13px;
  }
  #controls button:hover { background: #e94560; }
  #controls button:disabled { opacity: 0.4; cursor: default; }
  #turn-slider { flex: 1; accent-color: #e94560; }
  #turn-label { font-size: 13px; color: #aaa; min-width: 100px; }
  #speed-control { font-size: 12px; color: #aaa; }
  #speed-control select {
    background: #0f3460; color: #e0e0e0; border: 1px solid #333;
    border-radius: 4px; padding: 2px 6px;
  }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viewer {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; overflow: auto; padding: 16px; background: #0d0d1a;
  }
  #frame-img {
    max-width: 100%; max-height: 70vh; border: 1px solid #333;
    image-rendering: pixelated;
  }
  #frame-label { font-size: 12px; color: #888; margin-top: 8px; }
  #frame-nav { display: flex; gap: 8px; margin-top: 8px; }
  #frame-nav button {
    background: #16213e; color: #aaa; border: 1px solid #333;
    border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 12px;
  }
  #frame-nav button:hover { border-color: #e94560; color: #e0e0e0; }
  #sidebar {
    width: 400px; background: #16213e; border-left: 1px solid #0f3460;
    overflow-y: auto; padding: 16px; flex-shrink: 0;
  }
  #sidebar h2 {
    font-size: 12px; text-transform: uppercase; color: #e94560;
    margin-bottom: 8px; margin-top: 16px;
  }
  #sidebar h2:first-child { margin-top: 0; }
  #sidebar .panel {
    background: #1a1a2e; border-radius: 6px; padding: 12px;
    font-size: 13px; line-height: 1.5; margin-bottom: 12px;
    white-space: pre-wrap; word-break: break-word;
  }
  #sidebar .panel.error { border-left: 3px solid #e94560; }
  #sidebar .panel .label { color: #888; font-size: 11px; text-transform: uppercase; }
  #sidebar .panel .value { color: #e0e0e0; }
  #transcript { max-height: 200px; overflow-y: auto; }
  .state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .state-grid .item { font-size: 12px; }
  .state-grid .item .label { color: #888; }
  #jump-to { display: flex; gap: 4px; align-items: center; }
  #jump-to input {
    width: 60px; background: #0f3460; color: #e0e0e0; border: 1px solid #333;
    border-radius: 4px; padding: 2px 6px; font-size: 12px;
  }
</style>
</head>
<body>
<div id="header">
  <h1>CoQ Replay</h1>
  <div id="controls">
    <button id="btn-prev-turn" title="Previous turn (Left)">&#x25C0; Turn</button>
    <button id="btn-prev-frame" title="Previous frame (, )">&#x25C0; Frame</button>
    <button id="btn-play" title="Play/Pause (Space)">&#x25B6;</button>
    <button id="btn-next-frame" title="Next frame (.)">Frame &#x25B6;</button>
    <button id="btn-next-turn" title="Next turn (Right)">Turn &#x25B6;</button>
  </div>
  <input type="range" id="turn-slider" min="0" max="0" value="0">
  <span id="turn-label">Turn 0 / 0</span>
  <div id="speed-control">
    Speed: <select id="speed">
      <option value="2000">0.5x</option>
      <option value="1000" selected>1x</option>
      <option value="500">2x</option>
      <option value="250">4x</option>
    </select>
  </div>
  <div id="jump-to">
    <input type="number" id="jump-input" min="0" placeholder="Turn #">
    <button id="btn-jump">Go</button>
  </div>
</div>
<div id="main">
  <div id="viewer">
    <img id="frame-img" alt="Game frame" src="">
    <div id="frame-label">No frame</div>
    <div id="frame-nav"></div>
  </div>
  <div id="sidebar">
    <h2>Decision</h2>
    <div class="panel" id="panel-reasoning"><span class="label">Reasoning</span><br><span class="value" id="val-reasoning">—</span></div>
    <div class="panel" id="panel-tool"><span class="label">Tool Call</span><br><span class="value" id="val-tool">—</span></div>
    <h2>State</h2>
    <div class="panel">
      <div class="state-grid">
        <div class="item"><span class="label">Screen:</span> <span class="value" id="val-screen">—</span></div>
        <div class="item"><span class="label">HP:</span> <span class="value" id="val-hp">—</span></div>
        <div class="item"><span class="label">Hunger:</span> <span class="value" id="val-hunger">—</span></div>
        <div class="item"><span class="label">Location:</span> <span class="value" id="val-location">—</span></div>
        <div class="item"><span class="label">Goal:</span> <span class="value" id="val-goal">—</span></div>
        <div class="item"><span class="label">Turn:</span> <span class="value" id="val-turn">—</span></div>
      </div>
    </div>
    <h2>Timing</h2>
    <div class="panel">
      <div class="state-grid">
        <div class="item"><span class="label">Decision:</span> <span class="value" id="val-decision-ms">—</span></div>
        <div class="item"><span class="label">Turn total:</span> <span class="value" id="val-turn-ms">—</span></div>
        <div class="item"><span class="label">Wait:</span> <span class="value" id="val-wait-time">—</span></div>
        <div class="item"><span class="label">Changed:</span> <span class="value" id="val-changed">—</span></div>
      </div>
    </div>
    <h2>Transcript</h2>
    <div class="panel" id="transcript"><span class="value" id="val-transcript">—</span></div>
    <h2>Journal Note</h2>
    <div class="panel" id="panel-journal"><span class="value" id="val-journal">—</span></div>
  </div>
</div>

<script>
// --- State ---
let events = [];
let turns = [];       // [{turn, events: [...], frames: [{label, file}]}]
let currentTurn = 0;
let currentFrameIdx = 0;
let playing = false;
let playTimer = null;

// --- Load data ---
async function load() {
  const resp = await fetch('/api/events');
  events = await resp.json();
  buildTurns();
  setupSlider();
  showTurn(0);
}

function buildTurns() {
  const turnMap = new Map();
  for (const ev of events) {
    const t = ev.turn ?? 0;
    if (!turnMap.has(t)) {
      turnMap.set(t, { turn: t, events: [], frames: [] });
    }
    const turn = turnMap.get(t);
    turn.events.push(ev);
    if (ev.type === 'turn_start' && ev.frame) {
      turn.frames.push({ label: 'start', file: ev.frame });
    }
    if (ev.type === 'frame' && ev.frame) {
      turn.frames.push({ label: ev.label, file: ev.frame });
    }
    if (ev.type === 'turn_end' && ev.frame) {
      turn.frames.push({ label: 'end', file: ev.frame });
    }
    if (ev.type === 'tool_result' && ev.image) {
      turn.frames.push({ label: 'tool-result', file: ev.image });
    }
  }
  turns = Array.from(turnMap.values()).sort((a, b) => a.turn - b.turn);
}

function setupSlider() {
  const slider = document.getElementById('turn-slider');
  slider.max = Math.max(0, turns.length - 1);
  slider.addEventListener('input', (e) => {
    stopPlay();
    showTurn(parseInt(e.target.value));
  });
}

function findEvent(turn, type) {
  return turn.events.find(e => e.type === type);
}

function showTurn(idx) {
  if (idx < 0 || idx >= turns.length) return;
  currentTurn = idx;
  currentFrameIdx = 0;
  const turn = turns[idx];

  document.getElementById('turn-slider').value = idx;
  document.getElementById('turn-label').textContent =
    `Turn ${turn.turn} / ${turns[turns.length - 1]?.turn ?? 0}`;

  // Decision
  const dec = findEvent(turn, 'decision');
  if (dec) {
    document.getElementById('val-reasoning').textContent = dec.reasoning || '—';
    document.getElementById('val-tool').textContent =
      `${dec.tool}(${JSON.stringify(dec.args)})`;
    document.getElementById('val-screen').textContent = dec.screen || '—';
    document.getElementById('val-hp').textContent =
      dec.hp != null ? `${dec.hp}/${dec.max_hp ?? '?'}` : '—';
    document.getElementById('val-hunger').textContent = dec.hunger || '—';
    document.getElementById('val-location').textContent = dec.location || '—';
    document.getElementById('val-goal').textContent = dec.goal || '—';
    document.getElementById('val-journal').textContent = dec.journal_note || '—';
  }

  // Timing
  const timing = findEvent(turn, 'timing');
  if (timing) {
    document.getElementById('val-decision-ms').textContent =
      timing.decision_ms != null ? `${timing.decision_ms}ms` : '—';
    document.getElementById('val-turn-ms').textContent =
      timing.turn_total_ms != null ? `${timing.turn_total_ms}ms` : '—';
  }
  const end = findEvent(turn, 'turn_end');
  if (end) {
    document.getElementById('val-wait-time').textContent =
      end.wait_time != null ? `${end.wait_time}s` : '—';
    document.getElementById('val-changed').textContent =
      end.turn_changed != null ? (end.turn_changed ? 'yes' : 'no') : '—';
  }

  // Transcript
  const tr = findEvent(turn, 'transcript');
  document.getElementById('val-transcript').textContent = tr ? tr.text : '—';

  // Tool result error highlight
  const tr_err = findEvent(turn, 'tool_result');
  const panelTool = document.getElementById('panel-tool');
  if (tr_err && tr_err.error) {
    panelTool.classList.add('error');
    document.getElementById('val-tool').textContent +=
      `\nERROR: ${tr_err.text}`;
  } else {
    panelTool.classList.remove('error');
  }

  document.getElementById('val-turn').textContent = turn.turn;

  showFrame(0);
  updateFrameNav();
}

function showFrame(idx) {
  const turn = turns[currentTurn];
  if (!turn || turn.frames.length === 0) return;
  currentFrameIdx = Math.max(0, Math.min(idx, turn.frames.length - 1));
  const frame = turn.frames[currentFrameIdx];
  document.getElementById('frame-img').src = `/frames/${frame.file}`;
  document.getElementById('frame-label').textContent =
    `Turn ${turn.turn} — Frame ${currentFrameIdx + 1}/${turn.frames.length} (${frame.label})`;
  updateFrameNav();
}

function updateFrameNav() {
  const turn = turns[currentTurn];
  const nav = document.getElementById('frame-nav');
  nav.innerHTML = '';
  if (!turn) return;
  turn.frames.forEach((f, i) => {
    const btn = document.createElement('button');
    btn.textContent = f.label;
    if (i === currentFrameIdx) btn.style.borderColor = '#e94560';
    btn.onclick = () => { stopPlay(); showFrame(i); };
    nav.appendChild(btn);
  });
}

// --- Playback ---
function startPlay() {
  playing = true;
  document.getElementById('btn-play').textContent = '⏸';
  playTimer = setInterval(() => {
    const turn = turns[currentTurn];
    if (currentFrameIdx < turn.frames.length - 1) {
      showFrame(currentFrameIdx + 1);
    } else if (currentTurn < turns.length - 1) {
      showTurn(currentTurn + 1);
    } else {
      stopPlay();
    }
  }, parseInt(document.getElementById('speed').value));
}

function stopPlay() {
  playing = false;
  document.getElementById('btn-play').textContent = '▶';
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
}

// --- Controls ---
document.getElementById('btn-play').onclick = () => playing ? stopPlay() : startPlay();
document.getElementById('btn-prev-turn').onclick = () => { stopPlay(); showTurn(currentTurn - 1); };
document.getElementById('btn-next-turn').onclick = () => { stopPlay(); showTurn(currentTurn + 1); };
document.getElementById('btn-prev-frame').onclick = () => { stopPlay(); showFrame(currentFrameIdx - 1); };
document.getElementById('btn-next-frame').onclick = () => { stopPlay(); showFrame(currentFrameIdx + 1); };
document.getElementById('btn-jump').onclick = () => {
  stopPlay();
  const t = parseInt(document.getElementById('jump-input').value);
  const idx = turns.findIndex(tn => tn.turn >= t);
  if (idx >= 0) showTurn(idx);
};
document.getElementById('speed').onchange = () => {
  if (playing) { stopPlay(); startPlay(); }
};

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case ' ': e.preventDefault(); playing ? stopPlay() : startPlay(); break;
    case 'ArrowLeft': stopPlay(); showTurn(currentTurn - 1); break;
    case 'ArrowRight': stopPlay(); showTurn(currentTurn + 1); break;
    case ',': case 'ArrowUp': stopPlay(); showFrame(currentFrameIdx - 1); break;
    case '.': case 'ArrowDown': stopPlay(); showFrame(currentFrameIdx + 1); break;
  }
});

load();
</script>
</body>
</html>
